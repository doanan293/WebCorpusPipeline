[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hust-data-pipeline"
version = "0.1.0"
description = "Crawl, download, extract, store and share the HUST document corpus"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv==1.1.1",
    "PyYAML==6.0.2",
    "pymongo>=4.10,<5",
    "kaggle>=1.7,<2",
]

[project.optional-dependencies]
crawl = [
    "lxml==6.1.2",
    "playwright==1.62.0",
    "Scrapy==2.17.0",
    "scrapy-playwright==0.0.48",
]
producer = [
    "hust-data-pipeline[crawl]",
    "aiohttp>=3.11,<4",
    "PyMuPDF>=1.25,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "python-pptx>=1.0,<2",
    "llama-cloud>=1,<2",
    "filelock>=3.16,<4",
]
dev = [
    "hust-data-pipeline[crawl]",
    "pytest==9.1.1",
    "pytest-asyncio>=0.24,<2",
    "ruff==0.12.10",
]

[project.scripts]
ir-data = "ir_data.cli:main"
hust-discover = "hust_crawler.crawl.discovery_cli:main"
hust-crawl = "hust_crawler.crawl.cli:main"
hust-domain-audit = "hust_crawler.domain_audit:main"


[tool.hatch.build.targets.wheel]
packages = ["src/hust_crawler", "src/ir_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "performance: local algorithmic performance tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
