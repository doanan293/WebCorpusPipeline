[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline"
version = "0.1.0"
description = "Crawl, download, extract, store and share the HUST document corpus"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv==1.1.1",
    "PyYAML==6.0.2",
    "pymongo>=4.10,<5",
    "kaggle>=1.7,<2",
    "typer>=0.20,<1",
]

[project.optional-dependencies]
crawl = [
    "lxml==6.1.2",
    "playwright==1.62.0",
    "Scrapy==2.17.0",
    "scrapy-playwright==0.0.48",
]
enrich = [
    "data-pipeline[crawl]",
    "aiohttp>=3.11,<4",
    "PyMuPDF>=1.25,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "python-pptx>=1.0,<2",
    "llama-cloud>=1,<2",
    "filelock>=3.16,<4",
]
[dependency-groups]
dev = [
    "data-pipeline[enrich]",
    "pytest==9.1.1",
    "pytest-asyncio>=0.24,<2",
    "ruff==0.17.0",
    "pyrefly==1.3.2",
    "pre-commit>=4.7,<5",
]

[project.scripts]
ir-data = "data_pipeline.cli.ir_data:main"
hust-discover = "data_pipeline.cli.discover:main"
hust-crawl = "data_pipeline.cli.crawl:main"
hust-domain-audit = "data_pipeline.domains.audit:main"


[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -m 'not performance'"
markers = [
    "performance: local algorithmic performance tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "N", "C4", "PERF", "RET", "TRY",
    "ARG", "ERA", "S", "T20", "DTZ", "BLE", "FBT", "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["data_pipeline"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT"]
"src/data_pipeline/cli/**" = ["PLC0415", "T20"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src"]
python-interpreter-path = ".venv/bin/python"
