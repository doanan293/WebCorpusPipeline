download:
  concurrency: 64
  per_host: 2
  host_delay_seconds: 0.25
  max_file_bytes: 104857600
  request_timeout_seconds: 60
  retries: 3
  max_redirects: 20
  chunk_bytes: 262144
  checkpoint_bytes: 1048576
parser:
  local_workers: 8
  cloud_workers: 8
  cloud_poll_seconds: 5
  cloud_timeout_seconds: 1800
database:
  mongo_uri: mongodb://127.0.0.1:27017
  mongo_database: information_retrieval
