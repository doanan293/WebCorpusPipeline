# Điều khiển dùng chung cho cả lớp. `--profile demo` thêm hai node Tải về giả lập (cổng 8800, 8801).
services:
  dieu-khien:
    build: .
    image: dieu-khien:latest
    restart: unless-stopped
    command: ["serve", "--config", "${DIEU_KHIEN_CONFIG:-config/controller.yaml}"]
    ports: ["5200:5200"]
    volumes:
      - ./config:/app/config:ro
      - dieu_khien_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5200/add', data=b'{\"urls\": []}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  fake-fetcher-1:
    profiles: [demo]
    image: dieu-khien:latest
    entrypoint: ["python", "-m", "demo.fake_fetcher", "--port", "8800"]
    ports: ["8800:8800"]

  fake-fetcher-2:
    profiles: [demo]
    image: dieu-khien:latest
    entrypoint: ["python", "-m", "demo.fake_fetcher", "--port", "8801"]
    ports: ["8801:8801"]

volumes:
  dieu_khien_state:
