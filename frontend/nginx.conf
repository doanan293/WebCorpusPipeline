# Trang tinh + chuyen API: /api/ sang lucene, /crawl sang merger.
server {
    listen 80;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # Phan giai lai ten dich vu moi 10 giay: tao lai container thi IP doi.
    resolver 127.0.0.11 valid=10s;
    set $lucene http://lucene:8080;
    set $merger http://merger:3300;

    location = /nginx.conf { return 404; }

    # Luon hoi lai may chu: sua frontend xong tai lai trang la thay, khong can xoa cache.
    location / {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass $lucene;
        proxy_read_timeout 120s;
    }

    # Khong dung tien to "/crawl": se nuot ca /crawl.js.
    location = /crawl {
        proxy_pass $merger;
    }

    location /crawl/ {
        proxy_pass $merger;
    }
}
