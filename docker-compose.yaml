# Toan bo he thong demo: MongoDB, cac khoi crawler, lucene, frontend. Chay tu thu muc goc repo.
#
#   docker compose up -d --build                                     # bat tat ca
#   DUMP=<ten-file>.archive.gz docker compose run --rm restore       # nap ban dump trong crawler/data/submission/
name: webcorpus

# Moi khoi crawler mot container (mot image). Thu tu bat theo dong du lieu, cuoi nguon truoc.
x-crawler: &crawler
  build:
    context: ./crawler
    dockerfile: Dockerfile
  image: crawler:latest
  restart: unless-stopped
  # User cua may, de trang thai dung chung van ghi duoc bang `crawler crawl run` tren may.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./crawler/config:/app/config:ro

services:
  mongo:
    # 7.0 chu khong phai 8.0: mongo 8.0 tu thoat tren kernel Linux 6.19 - 7.0.13 (TCMalloc/rseq,
    # SERVER-121912), ma Docker Desktop hien chay kernel 7.0.12.
    image: mongo:7.0
    restart: unless-stopped
    # WiredTiger mac dinh lay ~1/2 RAM; 1 GB du cho demo.
    command: ["--wiredTigerCacheSizeGB", "1"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Chay mot lan: DUMP=<ten-file>.archive.gz docker compose run --rm restore
  restore:
    image: mongo:7.0
    profiles: ["restore"]
    depends_on:
      mongo: {condition: service_healthy}
    volumes:
      - ./crawler/data/submission:/dump:ro
    command:
      - mongorestore
      - --uri=mongodb://mongo:27017
      - --gzip
      - --archive=/dump/${DUMP:-}   # bo trong thi mongorestore bao loi, khong dung nham ban dump
      - --drop

  storage:  # storage (5)
    <<: *crawler
    command: ["serve", "storage", "--port", "2200"]
    ports: ["2200:2200"]
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:2200/add', data=b'{}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  reader:  # reader (1)
    <<: *crawler
    command: ["serve", "reader"]
    ports: ["6600:6600"]
    environment:
      MERGER_URL: http://merger:3300
    depends_on:
      merger: {condition: service_healthy}
    env_file:
      - path: ./crawler/.env
        required: false
    volumes:
      - ./crawler/config:/app/config:ro
      - ./crawler/data/enrichment/cache:/app/data/enrichment/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:6600/parse', data=b'', headers={'X-Url': 'http://health/', 'X-Format': 'html'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  downloader-1:  # downloader (2)
    <<: *crawler
    command: ["serve", "downloader", "--port", "8800"]
    ports: ["8800:8800"]
    environment:
      READER_URL: http://reader:6600
    depends_on:
      reader: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:' + sys.argv[1] + '/ping', timeout=3).status == 200 else 1)", "8800"]
      interval: 10s
      timeout: 5s
      retries: 12

  downloader-2:  # downloader (2), node thu hai
    <<: *crawler
    command: ["serve", "downloader", "--port", "8801"]
    ports: ["8801:8801"]
    environment:
      READER_URL: http://reader:6600
    depends_on:
      reader: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:' + sys.argv[1] + '/ping', timeout=3).status == 200 else 1)", "8801"]
      interval: 10s
      timeout: 5s
      retries: 12

  mediator:  # mediator (3)
    <<: *crawler
    # Cau hinh demo: trang thai rieng trong data/state-demo, khong dung toi hang doi crawl that.
    command: ["serve", "mediator", "--config", "config/mediator.demo.yaml"]
    ports: ["5200:5200"]
    volumes:
      - ./crawler/config:/app/config:ro
      - ./crawler/data/state-demo:/app/data/state-demo
    depends_on:
      downloader-1: {condition: service_healthy}
      downloader-2: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5200/add', data=b'{\"urls\": []}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  merger:  # merger (4)
    <<: *crawler
    # Cau hinh demo: khong mam, chi lan theo POST /crawl.
    command: ["serve", "merger", "--config", "config/merger.demo.yaml"]
    ports: ["3300:3300"]
    environment:
      STORAGE_URL: http://storage:2200
      MEDIATOR_URL: http://mediator:5200
    volumes:
      - ./crawler/config:/app/config:ro
      - ./crawler/data/state-demo:/app/data/state-demo
    depends_on:
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:3300/add', data=b'{}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Lan dau tu lap chi muc tu MongoDB (~10 phut), cac lan sau len ngay.
  lucene:
    build: ./lucene
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports: ["127.0.0.1:8081:8080"]   # chi de go loi; trinh duyet di qua frontend
    volumes:
      - lucene_index:/data/index
    depends_on:
      mongo: {condition: service_healthy}

  # Trang demo: http://localhost:8080
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lucene
      - merger

volumes:
  mongo_data:
    name: lucene_mongo_data
  lucene_index:
