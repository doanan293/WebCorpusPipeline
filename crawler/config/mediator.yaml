# mediator (khối 3 trên slide): nhận POST /add, gửi URL xoay vòng sang các node downloader.
port: 5200
downloaders:                       # node downloader (khối 2); cổng theo slide là 8800
  - http://downloader-1:8800
  - http://downloader-2:8801
host_delay_seconds: 1.0            # "thời gian chờ" tối thiểu giữa hai lần gửi vào cùng một host
per_host_concurrency: 2            # số URL của một host đang tải cùng lúc (mỗi node một URL)
autothrottle: true                 # giãn khoảng chờ khi host trả lời chậm (đo bằng /ping)
autothrottle_start_delay_seconds: 0.25
autothrottle_max_delay_seconds: 5
autothrottle_target_concurrency: 4
ping_timeout_seconds: 2
load_timeout_seconds: 10
node_cooldown_seconds: 30          # node lỗi thì tạm bỏ qua chừng này giây
max_attempts: 5
tick_seconds: 0.5
recrawl_days: {hub: 1, page: 7, document: 30}   # 0 = không crawl lại
database: data/state/mediator.sqlite3   # dùng chung với `data-pipeline crawl run`
