# The blocks of the slide, each its own container (one image), plus MongoDB (mongoose).
name: services
# Start order follows the data downstream-first (storage, merger, reader, downloaders, mediator),
# so no block sends to one that is not up yet. The merger's start pages wait in its outbox
# until the mediator is up.
x-service: &service
  build:
    context: ..
    dockerfile: server/Dockerfile
  image: services:latest
  restart: unless-stopped
  # The host user, so the shared state stays writable by `data-pipeline crawl run` on the host.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ../core/config:/app/data_pipeline/config:ro

services:
  mongoose:  # Mongo (6)
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongoose_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  storage:  # storage (5)
    <<: *service
    command: ["serve", "storage", "--port", "2200"]
    ports: ["2200:2200"]
    environment:
      MONGODB_URI: mongodb://mongoose:27017
    depends_on:
      mongoose: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:2200/add', data=b'{}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  reader:  # reader (1)
    <<: *service
    command: ["serve", "reader"]
    ports: ["6600:6600"]
    environment:
      MERGER_URL: http://merger:3300
    depends_on:
      merger: {condition: service_healthy}
    env_file:
      - path: ../core/.env
        required: false
    volumes:
      - ../core/config:/app/data_pipeline/config:ro
      - ../core/data/enrichment/cache:/app/data_pipeline/data/enrichment/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:6600/parse', data=b'', headers={'X-Url': 'http://health/', 'X-Format': 'html'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  downloader-1:  # downloader (2)
    <<: *service
    command: ["serve", "downloader", "--port", "8800"]
    ports: ["8800:8800"]
    environment:
      READER_URL: http://reader:6600
    depends_on:
      reader: {condition: service_healthy}
    healthcheck: &ping
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:' + sys.argv[1] + '/ping', timeout=3).status == 200 else 1)", "8800"]
      interval: 10s
      timeout: 5s
      retries: 12

  downloader-2:  # downloader (2), second node
    <<: *service
    command: ["serve", "downloader", "--port", "8801"]
    ports: ["8801:8801"]
    environment:
      READER_URL: http://reader:6600
    depends_on:
      reader: {condition: service_healthy}
    healthcheck:
      <<: *ping
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:' + sys.argv[1] + '/ping', timeout=3).status == 200 else 1)", "8801"]

  mediator:  # mediator (3)
    <<: *service
    command: ["serve", "mediator"]
    ports: ["5200:5200"]
    volumes:
      - ../core/config:/app/data_pipeline/config:ro
      - ../core/data/state:/app/data_pipeline/data/state
    depends_on:
      downloader-1: {condition: service_healthy}
      downloader-2: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:5200/add', data=b'{\"urls\": []}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  merger:  # merger (4)
    <<: *service
    command: ["serve", "merger"]
    ports: ["3300:3300"]
    environment:
      STORAGE_URL: http://storage:2200
      MEDIATOR_URL: http://mediator:5200
    volumes:
      - ../core/config:/app/data_pipeline/config:ro
      - ../core/data/state:/app/data_pipeline/data/state
    depends_on:
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:3300/add', data=b'{}', headers={'Content-Type': 'application/json'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongoose_data:
    name: data_pipeline_mongodb_data  # the Mongo data from before the rename, kept as it is
