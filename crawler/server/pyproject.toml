[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "services"
version = "0.1.0"
description = "The five blocks of the slide as HTTP services, over the data_pipeline core"
requires-python = ">=3.13,<3.14"
dependencies = [
    "data-pipeline",
    "aiohttp>=3.11,<4",
    "typer>=0.20,<1",
]

[tool.uv.sources]
data-pipeline = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "pyrefly==1.3.2",
    "types-PyYAML>=6,<7",
]

[project.scripts]
services = "services.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/services"]

[tool.pytest.ini_options]
testpaths = ["service_tests"]
# Named service_tests so that `tests` stays core/tests: tests.fakes and the fake website come from core/tests, shared with the one-process crawl.
pythonpath = ["src", "../core"]
addopts = "--import-mode=importlib --strict-markers -m 'not docker'"
markers = [
    "docker: needs the compose services (MongoDB) running",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "service_tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "N", "C4", "PERF", "RET", "TRY",
    "ARG", "ERA", "S", "T20", "DTZ", "BLE", "FBT", "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["services", "data_pipeline", "tests"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8
max-branches = 16
max-returns = 8
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"service_tests/**" = ["E501", "S101", "PLR2004", "ARG", "FBT", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "INP001"]
"src/services/cli.py" = ["PLC0415", "T20", "FBT001", "FBT002", "PLR0913", "PLR0917"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "service_tests"]
search-path = ["src", ".", "../core"]
python-interpreter-path = ".venv/bin/python"
